<!---Reset Password Sent Page-->
<!DOCTYPE html>
<html>
    <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewpoint" content="width=device-width, initial-scale=1">
    <title>Sportslink Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="css/styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"defer></script>
    </head>
    <body>
            
                <!---Navigation Bar--->
                <nav class="navbar navbar-expand-lg px-3 py-2 sl-navbar">
                    <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="#">
                    <img src="../frontend/images/white-maple-leaf.png" alt="maple leaf" class="sl-logo">Sportslink
                    </a>
                </nav>

                    <!---Main page-->
                    <div class="container-fluid">               
                        <div class="row">

                            <!---sidebar-->
                            <div class="col-1 sidebar">
                            </div>

                            <!---Form Content-->
                            <div class="col-11 pt-5 align-items-center">

            

                                <div class="d-flex justify-content-center align-items-center">
                                    <!--forgot password form-->
                                    <form action="" method="POST" id="forgotPasswordSentForm">
                                        
                                        <h1 class=" h1 fw-semibold text-dark mt-1 mb-3 text-center">Password Reset link has been sent!</h1>
                                        <p class="my-1 text-body-secondary text-center">A reset password link has been sent to your specified email address.
                                             Follow the link to select a new password.</p>
                                        <p class="my-1 text-body-secondary text-center">If you did not recieve a reset password link, please check your 
                                            span or junk folder.</p>

                                         <!--back to login Button-->
                                        <div class="d-flex justify-content-center align-items-center text-center">
                                            <button class="btn-backToLogin btn-outline-secondary border-1 rounded-2 mt-3 py-1 bg-white w-50 " id="btnBackToLogin">Back to Login</button>
                                        </div>
                                    </form>


                                </div>
                            </div>
                        </div>
                </div>

        <script src="forgot_password.js"></script>
    </body>
</html>
