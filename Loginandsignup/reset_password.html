<!---Reset Password Page-->
<!DOCTYPE html>
<html>
    <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewpoint" content="width=device-width, initial-scale=1">
    <title>Sportslink Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="css/styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"defer></script>
    </head>
    <body>
            
                <!---Navigation Bar--->
                <nav class="navbar navbar-expand-lg px-3 py-2 sl-navbar">
                    <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="#">
                    <img src="../frontend/images/white-maple-leaf.png" alt="maple leaf" class="sl-logo">Sportslink
                    </a>
                </nav>

                    <!---Main page-->
                    <div class="container-fluid">               
                        <div class="row">

                            <!---sidebar-->
                            <div class="col-1 sidebar">
                            </div>

                            <!---Form Content-->
                            <div class="col-11 pt-5 align-items-center">

            

                                <div class="d-flex justify-content-center align-items-center">
                                    <!--forgot password form-->
                                    <form action="login.html" method="POST" class="needs-validation" novalidate id="resetPasswordForm">
                                        
                                        <h1 class=" h1 fw-semibold text-dark mt-1 mb-3 text-center">Reset your password</h1>
                                        <div class="mb-3">
                                            <!--password input-->
                                            <label for="newPswd" class="form-label mt-2"> New Password </label>
                                            <input type="password" class="form-control w-100" id="newPswd" placeholder="Enter new password" required auto>
                                            

                                            <label for="confirmPswd" class="form-label mt-2">Confirm New Passoword</label>
                                            <input type="password" class="form-control w-100" id="confirmPswd" placeholder="Enter your password again" required auto>
                                            
                                            <div class="fw-semibold" id="PswdError"></div>
                                            
                                        </div>

                                        <p id="message" class="fw-semibold"></p>
                                           

                                        <!--Submit Button-->
                                        <div class="d-flex justify-content-end">
                                        <button type="submit" id="btnResetPassword" class="btn-reset btn-outline-secondary border-1 rounded-2 mt-4 py-1 text-white w-100" href="#">Update Password</button>
                                        </div> 
    
                                    </form>

                                    <div class="alert alert-success mt-2 d-none" role="alert" id="alertSuccessfull"></div>
                                </div>
                            </div>
                        </div>
                </div>

        <script src="forgot_password.js"></script>
    </body>
</html>
