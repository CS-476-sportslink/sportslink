<!--Singnup Role Page-->
<!DOCTYPE html>
<html>
    <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewpoint" content="width=device-width, initial-scale=1">
    <title>Sportslink Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="css/styles2.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"defer></script>
    </head>
    <body>
            
                <!---Navigation Bar--->
                <nav class="navbar navbar-expand-lg px-3 py-2 sl-navbar">
                    <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="#">
                    <img src="../frontend/images/white-maple-leaf.png" alt="maple leaf" class="sl-logo">Sportslink
                    </a>
                </nav>

                    <!---Main page-->
                    <div class="container-fluid">               
                        <div class="row">

                            <!---sidebar-->
                            <div class="col-1 sidebar">
                            </div>

                            <!---Form Content-->
                            <div class="col-11 pt-5 align-items-center">

                                <div class="d-flex justify-content-center align-items-center ">
                                    <div class="px-5 py-5">
                                        <div class="d-flex justify-content-center">
                                            <h1 class="text-center text-dark mb-4">Pick a Role</h1>
                                        </div>

                                        <!--Radio buttons for role choices-->
                                        
                                        <form action="" method="POST" class="sl-role-form" >
                                        
                                            <div class="btn-group-vertical d-flex flex-column gap-3 mx-auto" role="group" >
                                                <input type="radio" id="role-athlete" class="btn-check" name="roleChoice" value="Athlete">
                                                <label class="btn btn-light btn-outline-secondary text-dark rounded-2 py-2 text-center" for="role-athlete">Athlete</label>

                                                <input type="radio" id="role-coach" class="btn-check" name="roleChoice" value="Coach">
                                                <label class="btn btn-light btn-outline-secondary text-dark rounded-2 py-2 text-center" for="role-coach">Coach</label>
                                                
                                                <input type="radio" id="role-school" class="btn-check" name="roleChoice" value="School"> 
                                                <label class="btn btn-light btn-outline-secondary text-dark rounded-2 py-2 text-center" for="role-school">School</label>

                                            </div>
                                            
                                            <!--Submit button-->
                                            <div class="d-flex justify-content-center">
                                                 <button type="submit" class="btn-signup text-center mt-4 py-2 text-white border-1 rounded-2" href="bio.html"><b>Next</b></button>
                                            </div>
                                        </form>

                                          
                                </div>
                            </div>
                        </div>
                </div>

    <script src="loginsignup.js"></script>
    </body>
</html>
