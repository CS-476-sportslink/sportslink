<!--Signup Page-->
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>Sportslink Signup</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="css/styles.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">defer</script>
        
    </head>
    <body>
        <!--navbar-->
        <nav class="navbar navbar-expand-lg px-3 py-2 sl-navbar">
            <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="#">
                <img src="../frontend/images/white-maple-leaf.png" alt="maple leaf" class="sl-logo">Sportslink
            </a>
            <a class="nav-link text-white d-flex align-items-end" href="#">Home</a>
        </nav>

        <!--main page-->
        <div class="container-fluid">
            <div class="row">
            
                <!--Left Sidebar-->
                <div class="col-2 sidebar">
                </div>                

                <!--Signup Form-->
                <div class="col-10 pt-4 align-items-center ">
                    
                    <div class="d-flex justify-content-center">
                        <h1 class=" h1 fw-bold text-dark">Signup</h1>
                    </div>
                        <div class="d-flex justify-content-center">
                            <form action="" method="POST" class="Sform border-2 rounded">
                                <div class="text-center mb-3">
                                <h2 class="fs-1">Create your acount</h2>
                                </div>    

                                <div class="mb-2 ">
                                     <label for="fname" class="form-label">Firstname: </label>
                                    <input type="fname" class="form-control" id="fname" placeholder="Enter Firstname" required autofocus>
                                
                                    <label for="lname" class="form-label">Lastname: </label>
                                    <input type="lname" class="form-control" id="lname" placeholder="Enter Lastname" required autofocus>

                                    <label for="exampleEmail" class="form-label">Email address: </label>
                                    <input type="email" class="form-control" id="exampleEmail" placeholder="Enter Email address" required autofocus>

                                    <label for="inputPswd" class="form-label">Password: </label>
                                    <input type="password" class="form-control" id="inputPswd" placeholder="Password" autofocus>
                                </div>

                                    <div class="d-flex justify-content-end">
                                    <button type="submit" class="btn-signup text-center mt-2 text-white" href="#">Sign In </button>
                                    </div>
                                

                        </form>
        
                    </div>    
                        
                </div>
 
                </div>

            </div>
        </div>
    </body>
</html>
