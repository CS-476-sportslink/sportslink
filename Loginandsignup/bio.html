<!--Singnup Role Page-->
<!DOCTYPE html>
<html>
    <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewpoint" content="width=device-width, initial-scale=1">
    <title>Sportslink Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="css/styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"defer></script>
    </head>
    <body>
            
                <!---Navigation Bar--->
                <nav class="navbar navbar-expand-lg px-3 py-2 sl-navbar">
                    <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="#">
                    <img src="../frontend/images/white-maple-leaf.png" alt="maple leaf" class="sl-logo">Sportslink
                    </a>
                </nav>

                    <!---Main page-->
                    <div class="container-fluid">               
                        <div class="row">

                            <!---sidebar-->
                            <div class="col-2 sidebar">
                            </div>

                            <!---Main Content-->
                            <div class="col-10 pt-5 align-items-center">

                                <div class="d-flex justify-content-center align-items-center ">
                                    <div class="Sform border-2 rounded px-5 mt-5">

                                        <!--Upload Profile Picture-->
                                        <div class="text-center mb-3">
                                            <label for="formFile" class="d-inline-flex flex-column align-items-center mx-auto fw-semibold">
                                                <div class="rounded-circle bg-secondary border-0 d-flex justify-content-center align-items-center">
                                                </div>
                                                <span class="text-dark fw-medium mb-4">Upload Photo</span> 
                                            </label>
                                            <input class="form-control" type="file" id="formFile" name="profile-picture" accept="image/*" >     
                                        </div>

                                        <!--modal trigger button for bio-->
                                            <div class="d-flex flex-column gap-3 mx-auto mb-3" role="group" >
                                                <input type="radio" id="bio" class="btn-check" name="writeBio" value="Bio">
                                                <label class="btn btn-outline-dark rounded-3 py-2 text-center" for="bio" data-bs-toggle="modal" data-bs-target="#bio-modal">Bio</label>
                                            </div> 
                                            
                                            
                                        <!--modal trigger button for Sports-->
                                             <div class="d-flex flex-column gap-3 mx-auto mb-3" role="group" >
                                                <input type="radio" id="sport" class="btn-check" name="choose-sports" value="Sports">
                                                <label class="btn btn-outline-dark rounded-3 py-2 text-center" for="sport" data-bs-toggle="modal" data-bs-target="#sport-modal">Sport</label>
                                            </div> 
                                        

                                            
                                            <!--Submit button-->
                                            <div class="d-flex justify-content-end">
                                                 <button type="submit" class="btn-signup text-center mt-3 text-white" href="#"><b>Submit</b></button>
                                            </div>
                                        </form>

                                          
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!--Modal for bio-->
                <div class="modal-fade" id="bio-modal" tabindex="-1" aria-labelledby="modal-title" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="modal-title">Biography</h5>
                                <button type="button" class="btn-close" data-dismiss="modal"></button>
                            </div>

                            <div class="modal-body">
                                <form>
                                    <div class="form-group mb-3">
                                        <label for="biography" class="col-form-label">Write about yourself!</label>
                                        <input type="text" class="form-control" id="biography"> 
                                    </div>
                                </form>
                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-dark text-center rounded-2" data-dismiss="modal">close</button>
                                <button type="button" class="btn btn-outline-dark text-center rounded-2 mx-3"> Save changes</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!--Modal for sport-->
                <!--Modal for bio-->
                <div class="modal-fade" id="sport-modal" tabindex="-1" aria-labelledby="modal-title" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="modal-title">Sports</h5>
                                <button type="button" class="btn-close" data-dismiss="modal"></button>
                            </div>

                            <div class="modal-body">
                                <form>
                                    <div class="form-group mb-3">
                                        <label for="Sports" class="col-form-label">Which Sports do you play?</label>
                                        <input type="text" class="form-control" id="Sports"> 
                                    </div>
                                </form>
                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-dark text-center rounded-2" data-dismiss="modal">close</button>
                                <button type="button" class="btn btn-outline-dark text-center rounded-2 mx-3"> Save changes</button>
                            </div>
                        </div>
                    </div>
                </div>
    </body>
</html>
