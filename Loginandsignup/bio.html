<!--Singnup Role Page-->
<!DOCTYPE html>
<html>
    <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewpoint" content="width=device-width, initial-scale=1">
    <title>Sportslink Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="css/styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"defer></script>
    </head>
    <body>
            
                <!---Navigation Bar--->
                <nav class="navbar navbar-expand-lg px-3 py-2 sl-navbar">
                    <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="#">
                    <img src="../frontend/images/white-maple-leaf.png" alt="maple leaf" class="sl-logo">Sportslink
                    </a>
                </nav>

                    <!---Main page-->
                    <div class="container-fluid">               
                        <div class="row">

                            <!---sidebar-->
                            <div class="col-1 sidebar">
                            </div>
                            

                            <!---Main Content-->
                            <div class="col-11 pt-5 align-items-center">

                                <div class="d-flex justify-content-center align-items-center ">
                                    <div class=" px-5 pb-5">

                                        <!--Upload Profile Picture-->
                                        <div class="text-center mb-3">
                                            <label for="formFile" class="d-inline-flex flex-column align-items-center mx-auto fw-semibold">
                                                <div class="rounded-circle bg-secondary border-0 d-flex justify-content-center align-items-center">
                                                </div>
                                                <span class="text-dark fw-medium mb-4">Upload Photo</span> 
                                            </label>
                                            <input class="form-control" type="file" id="formFile" name="profile-picture" accept="image/*" >     
                                        </div>

                                        <!--modal trigger button for bio-->
                                                <button type="button" class="btn d-flex flex-column mb-3 btn-outline-secondary text-dark rounded-3 py-2 w-100 text-center"  data-bs-toggle="modal" data-bs-target="#bioModal">
                                                Bio
                                                </button>
                                            
                                            
                                        <!--modal trigger button for Sports-->
                                                <button type="button" class="btn d-flex flex-column mb-3 btn-outline-secondary text-dark rounded-3 py-2 w-100 text-center"  data-bs-toggle="modal" data-bs-target="#sportModal"> 
                                                Sports
                                                </button>
                        
                                            
                                            <!--Submit button-->
                                            <div class="d-flex justify-content-end">
                                                 <button type="submit" class="btn-signup text-center mt-3 py-2 text-white border-1 rounded-2" href="#"><b>Submit</b></button>
                                            </div>

                                    </div>

                                          
                                </div>
                            </div>
                        </div>
                    </div>

                <!--Modal for bio-->
                <div class="modal fade" id="bioModal" tabindex="-1" aria-labelledby="modal-bio" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <!--html wrapper that styles and contain header, body and footer-->
                        <div class="modal-content">
                            <!--Modal Header-->
                            <div class="modal-header">
                                <h5 class="modal-title" id="modal-title">Biography</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>

                            <!--Modal Body-->
                            <div class="modal-body">
                                <form>
                                    <div class="form-group mb-3">
                                        <label for="biography" class="col-form-label">Write about yourself!</label>
                                        <input type="text" class="form-control text-area" row="3" id="modal-bio" aria-placeholder="Write about yourself!"> 
                                    </div>
                                </form>
                            </div>

                            <!--Modal Footer-->
                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-dark text-center rounded-2" data-bs-dismiss="modal">close</button>
                                <button type="button" class="btn btn-outline-dark text-center rounded-2 mx-3"> Save changes</button>
                            </div>
                        </div>
                    </div>
                </div>


                <!--Modal for sport-->
                <div class="modal fade" id="sportModal" tabindex="-1" aria-labelledby="modal-sport" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <!--html wrapper that styles and contain header, body and footer-->
                        <div class="modal-content">
                            <!--Modal Header-->
                            <div class="modal-header">
                                <h5 class="modal-title" id="modal-title">Sports</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>

                            <!--Modal body-->
                            <div class="modal-body">
                                <form>
                                    <div class="form-group mb-3">
                                        <label for="Sports" class="col-form-label">Which Sports do you play?</label>
                                        <input type="text" class="form-control" row="3" id="modal-sport" aria-placeholder="Enter what sports you play"> 
                                    </div>
                                </form>
                            </div>

                            <!--Modal footer-->
                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-dark text-center rounded-2" data-bs-dismiss="modal">close</button>
                                <button type="button" class="btn btn-outline-dark text-center rounded-2 mx-3"> Save changes</button>
                            </div>
                        </div>
                    </div>
                </div>
    </body>
</html>
