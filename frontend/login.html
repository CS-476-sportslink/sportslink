<!---Longin Page-->
<!DOCTYPE html>
<html>
    <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewpoint" content="width=device-width, initial-scale=1">
    <title>Sportslink Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="css/styles2.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"defer></script>
    </head>
    <body>
            
                <!---Navigation Bar--->
                <nav class="navbar navbar-expand-lg px-3 py-2 sl-navbar">
                    <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="#">
                    <img src="images/white-maple-leaf.png" alt="maple leaf" class="sl-logo">Sportslink
                    </a>
                </nav>

                    <!---Main page-->
                    <div class="container-fluid">               
                        <div class="row">

                            <!---sidebar-->
                            <div class="col-1 sidebar">
                            </div>

                            <!---Form Content-->
                            <div class="col-11 pt-5 align-items-center">

            

                                <div class="d-flex justify-content-center align-items-center">
                                    <form action="" method="POST" class="needs-validation sl-login-form" novalidate>
                                        
                                        
                                        <h1 class=" h1 fw-bold text-dark mt-1 mb-3 text-center">Welcome Back</h1>
                                        <p class="my-1 text-body-secondary">Please enter your details</p>
                                        <div class="mb-3">
                                            <!--Email input-->
                                            <label for="email" class="form-label visually-hidden"> Email: </label>
                                            <input type="text" class="form-control mt-4" id="email" placeholder="Enter email" required auto>
                                            <div class="invalid-feedback">
                                                Please enter your email address
                                            </div>
                                        </div>

                                        <div class="mt-2">
                                            <!--Password input-->
                                            <label for="pswd" class="form-label visually-hidden"> Password: </label>
                                            <input type="password" class="form-control" id="pswd" placeholder="Enter Password" required auto>
                                            <div class="invalid-feedback">
                                                Please enter your password
                                            </div>
                                        </div>

                                        
                                               
                                        <div class="d-flex justify-content-between align-items-center mt-3">
                                                 <!--remember me checkbox-->
                                                <label>
                                                    <input type="checkbox" value="remember-me" class="m-1">Remember me
                                                </label>
                                            
                                                <!--Forget Password link-->
                                                <div class="float-end">
                                                    <a id="forgotPassword"  class="pwsd text-decoration-none">Forgot Password</a>
                                                </div>
                                        </div>

                                       

                                        <!--Login Button-->
                                        <div class="d-flex justify-content-end">
                                        <button type="submit" class="btn-login btn-outline-secondary border-1 rounded-2 mt-4 text-white">Login</button>
                                        </div> 
                                        
                                        
                                        <!--link to signup page-->
                                    <p class="text-center mt-3">
                                        Dont't have an account?
                                        <a href="signup.html" class="text-decoration-none">Signup</a>
                                    </p>
                                    </form>
                                </div>
                            </div>
                        </div>
                </div>


    <script src="loginsignup.js"></script>
    <script type="module" src="firebase-imports.js"></script>
    </body>
</html>
