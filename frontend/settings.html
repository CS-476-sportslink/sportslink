<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportslink Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"
        defer></script>
</head>

<body>

    <!-- Navbar with nav links -->
    <nav class="navbar navbar-expand-lg px-3 py-2 sl-navbar">
        <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="#">
            <img src="images/white-maple-leaf.png" alt="maple leaf" class="sl-logo">
            Sportslink
        </a>

        <form>
            <div class="sl-search d-flex align-items-center rounded-pill py-1 px-3">
                <span class="bi bi-search fs-5"></span>
                <input class="sl-search-input ms-2" type="search" placeholder="Search">
            </div>
        </form>


        <!-- nav links with boostrap icons -->
        <ul class="navbar-nav ms-auto d-flex flex-row gap-2">
            <li class="nav-item">
                <a class="nav-link text-white" href="home.html" title="Home">
                    <i class="bi bi-house-fill fs-5"></i>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="#" title="Messages">
                    <i class="bi bi-chat-fill fs-5"></i>
                </a>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link text-white" href="#" data-bs-toggle="dropdown" title="Notifications">
                    <span class="position-relative">
                        <i class="bi bi-bell-fill fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill sl-notification-badge">
                            3
                        </span>
                    </span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end sl-notification-dropdown">
                    <li class="px-3 py-2 border-bottom">
                        <div class="small fw-semibold">Notifications</div>
                        <button class="btn btn-sm text-danger p-0 sl-read-all-btn align-items-center">Mark all as read</button>
                    </li>
                    <li>
                        <a class="dropdown-item py-2 sl-notification-unread" href="#">
                            <div class="small fw-semibold">Coach Mike Jones followed you</div>
                            <div class="text-muted sl-notification-time">2h ago</div>
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item py-2 sl-notification-unread" href="#">
                            <div class="small fw-semibold">Jon Jones liked your post</div>
                            <div class="text-muted sl-notification-time">3h ago</div>
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item py-2 sl-notification-unread" href="#">
                            <div class="small fw-semibold">Mike Tyson commented on your post.</div>
                            <div class="text-muted sl-notification-time">4h ago</div>
                        </a>
                    </li>
                </ul>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link text-white dropdown-toggle current" href="#" data-bs-toggle="dropdown" title="Profile">
                    <i class="bi bi-person-circle fs-5"></i>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                        <a class="dropdown-item" href="profile.html">
                            <i class="bi bi-person me-2"></i>View Profile
                        </a>
                    </li>
                    <li>
                        <hr class=dropdown-divider>
                    </li>
                    <li>
                        <a class="dropdown-item" href="#">
                            <i class="bi bi-gear me-2"></i>Settings
                        </a>
                    </li>
                    <li>
                        <hr class=dropdown-divider>
                    </li>
                    <li>
                        <a class="dropdown-item text-danger" href="#" id="sl-logout-btn">
                            <i class="bi bi-box-arrow-right me-2"></i>Logout
                        </a>
                    </li>
                </ul>
            </li>
        </ul>
    </nav>


    <div class="container py-4">
        <div class="row g-4">

            <!--Profile and Account icons-->
            <div class="col-lg-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-2">
                        <ul class="nav flex-column sl-settings-nav">
                            <li class="nav-item">
                                <a class="nav-link active" href="#" data-section="account">
                                    <i class="bi bi-person me-2"></i>Account
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#" data-section="profile">
                                    <i class="bi bi-pencil me-2"></i>Profile
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="col-lg-9">

                <!--Account Section-->
                <div class="sl-settings-section active" id="section-account">
                    <div class="card border-0 mb-4">
                        <div class="card-body p-4">
                            <div class="sl-section-title">Account</div>

                            <!--Change Email-->
                            <div class="sl-setting-row d-flex align-items-center justify-content-between">
                                <div>
                                    <div class="fw-semibold">Email Address</div>
                                    <div class="text-muted small" id="sl-current-email"></div>
                                </div>
                                <button class="btn btn-outline-danger btn-sm" data-bs-toggle="collapse" data-bs-target="#changeEmail">Change</button>
                            </div>
                            <div class="collapse" id="changeEmail">
                                <div class="pt-3 pb-2">
                                    <label class="form-label small fw-semibold">New email address</label>
                                    <input type="email" class="form-control mb-2" id="sl-new-email" placeholder="Enter new email">
                                    <label class="form-label small fw-semibold">Confirm password</label>
                                    <input type="password" class="form-control mb-2" id="sl-confirm-password-email" placeholder="Enter your password">
                                    <button class="btn btn-danger btn-sm" id="sl-save-email-btn">Save email</button>
                                </div>
                            </div>

                            <!--Change Password-->
                            <div class="sl-setting-row d-flex align-items-center justify-content-between">
                                <div>
                                    <div class="fw-semibold">Password</div>
                                </div>
                                <button class="btn btn-outline-danger btn-sm" data-bs-toggle="collapse" data-bs-target="#changePassword">Change</button>
                            </div>
                            <div class="collapse" id="changePassword">
                                <div class="pt-3 pb-2">
                                    <label class="form-label small fw-semibold">Current password</label>
                                    <input type="password" class="form-control mb-2" id="sl-current-password" placeholder="Enter current password">
                                    <label class="form-label small fw-semibold">New password</label>
                                    <input type="password" class="form-control mb-2" id="sl-new-password" placeholder="Enter new password">
                                    <label class="form-label small fw-semibold">Confirm new password</label>
                                    <input type="password" class="form-control mb-2" id="sl-confirm-new-password" placeholder="Confirm new password">
                                    <button class="btn btn-danger btn-sm" id="sl-save-password-btn">Save password</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!--Profile edit-->
                <div class="sl-settings-section" id="section-profile">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-4">
                            <div class="sl-section-title mb-2">Profile</div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Display Name</label>
                                <input type="text" class="form-control" id="sl-profile-name" value="Brendan Stevenson">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Bio</label>
                                <textarea class="form-control" id="sl-profile-bio" rows="3" placeholder="Tell coaches about yourself...">Hockey Forward looking for a Usports team to play for in the next winter semester.</textarea>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">Sport</label>
                                    <input type="text" class="form-control" id="sl-profile-sport" value="Hockey">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">Position</label>
                                    <input type="text" class="form-control" id="sl-profile-position" value="Forward">
                                </div>
                            </div>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">Province</label>
                                    <select class="form-select" id="sl-profile-province">
                                        <option>AB</option>
                                        <option>BC</option>
                                        <option>MB</option>
                                        <option>NB</option>
                                        <option>NL</option>
                                        <option>NS</option>
                                        <option>ON</option>
                                        <option>PE</option>
                                        <option>QC</option>
                                        <option selected>SK</option>
                                        <option>NT</option>
                                        <option>NU</option>
                                        <option>YT</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">Current team</label>
                                    <input type="text" class="form-control" id="sl-profile-team" value="Saskatoon Bulldogs">
                                </div>
                            </div>
                            <button class="btn btn-danger btn-sm px-4" id="sl-save-profile-btn">Save changes</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>



<script src="app.js"></script>
<script src="settings.js"></script>

</body>
</html>
