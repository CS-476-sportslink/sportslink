<!--Signup Page-->
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>Sportslink Signup</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="css/styles2.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
        
    </head>
    <body>
        <!--navbar-->
        <nav class="navbar navbar-expand-lg w-100 py-2 sl-navbar">
            <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="#">
                <img src="images/white-maple-leaf.png" alt="maple leaf" class="sl-logo">Sportslink
            </a>
        </nav>

        <!--main page-->
        <div class="container-fluid">
            <div class="row">
            
                <!--Left Sidebar-->
                <div class="col-lg-6 d-none d-md-block p-0">
                    <!--Image on the leftside of the column-->
                    <img src="img/sports.jpg" class="vh-100 w-100" alt="Sports image ">
                </div>                

                <!--Signup Form-->
                <div class="col-lg-6 mt-5 align-items-center ">
                    
                        <div class="d-flex justify-content-center">
                            <form action="" method="POST" class="needs-validation sl-signup-form" novalidate >
                                <div class="text-center mb-3">
                                <!--Create your acount header-->
                                <h1 class="fs-1">Create your acount</h1>
                                </div>    
                                <!--create another row inside the form to place two inputs horizontally-->
                                  <div class="row">
                                    <!--split the row in half-->
                                    <div class="col-6 my-2">
                                        <!--Firstname input-->
                                        <label for="fname" class="form-label">Firstname: </label>
                                        <input type="text" class="form-control" id="fname" placeholder="Enter Firstname" required autofocus>
                                        <div class="invalid-feedback">
                                            Please enter your firstname
                                        </div>
                                    </div>

                                    <div class="col-6 my-2">
                                        <!--Lastname input-->
                                        <label for="lname" class="form-label">Lastname: </label>
                                        <input type="text" class="form-control" id="lname" placeholder="Enter Lastname" required autofocus>
                                        <div class="invalid-feedback">
                                            Please enter your lastname
                                        </div>
                                    </div> 
                                  </div>
                                  
                                  
                                <div class="my-2">
                                    <!--Email Address input-->
                                    <label for="exampleEmail" class="form-label">Email address: </label>
                                    <input type="email" class="form-control" id="exampleEmail" placeholder="Enter Email address" required autofocus>
                                    <div class="invalid-feedback">
                                        Please enter your email address
                                    </div>
                                </div>
                                <div class="my-2">
                                    <!--Password input-->
                                    <label for="inputPswd" class="form-label">Password: </label>
                                    <input type="password" class="form-control" pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^\w\s]).{8,}$"  id="inputPswd" placeholder="Password (8 characters minimum)" autofocus>
                                    <div class="invalid-feedback">
                                        Please enter your password
                                    </div>
                                </div>

                                    
                                    <div class="d-flex justify-content-end mt-3">
                                    <!--Submit Button-->
                                    <button type="submit" class="btn-signup text-center mt-4 text-white border-1 rounded-2" href="#">Create account </button>
                                    </div>
                                    
                                    <!--link to login page-->
                                    <p class="text-center mt-3">
                                        Already have an account?
                                        <a href="/login.html" class="">Sign in</a>
                                    </p>

                        </form>
        
                    </div>    
                        
                </div>
 
                </div>

            </div>
        </div>
    <script src="loginsignup.js"></script>
    <script type="module" src="firebase-imports.js"></script>
    </body>
</html>
